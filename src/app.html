<title>deelo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* deelo — app de bolsillo: barra de días arriba, la mejor jugada del día como héroe, opciones como cupones con el ahorro en pesos. Navegación inferior en celular. */
:root{
  --bg:#eef2f1; --paper:#ffffff; --sunk:#f5f7f9; --ink:#17203a; --ink2:#4f5a73; --ink3:#8a93a8;
  --rule:#e1e6ec; --navy:#1b2440; --navy2:#26315a; --on-navy:#f3f6ff; --on-navy2:#aeb8d6;
  --green:#3fbf86; --green-ink:#0d2a1c; --green-soft:#e2f6ec; --green-text:#17865a;
  --brand-navy:#1b2440; --brand-green:#46c48a;
  --warn:#8a5300; --warn-soft:#fff0d4; --bad:#a3302a; --bad-soft:#fde4e1;
  --shadow:0 1px 2px rgba(23,32,58,.06),0 6px 18px -10px rgba(23,32,58,.25);
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-brand:'Fredoka','Poppins',system-ui,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --paper:#151d31; --sunk:#10172a; --ink:#e9edf7; --ink2:#a8b2c8; --ink3:#6c7690;
  --rule:#243049; --navy:#22305a; --navy2:#2d3c6c; --on-navy:#f3f6ff; --on-navy2:#b4bedc;
  --green:#4fd096; --green-ink:#08190f; --green-soft:#143225; --green-text:#6fdcaa;
  --brand-navy:#d3dbef; --brand-green:#5fd39c;
  --warn:#f2bb63; --warn-soft:#3a2b10; --bad:#f39a92; --bad-soft:#3e1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --paper:#151d31; --sunk:#10172a; --ink:#e9edf7; --ink2:#a8b2c8; --ink3:#6c7690;
  --rule:#243049; --navy:#22305a; --navy2:#2d3c6c; --on-navy:#f3f6ff; --on-navy2:#b4bedc;
  --green:#4fd096; --green-ink:#08190f; --green-soft:#143225; --green-text:#6fdcaa;
  --brand-navy:#d3dbef; --brand-green:#5fd39c;
  --warn:#f2bb63; --warn-soft:#3a2b10; --bad:#f39a92; --bad-soft:#3e1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h2{font-size:19px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
button,input{font:inherit;color:inherit}
a{color:var(--green-text)}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.wrap{padding-block:22px 56px}}
.muted{color:var(--ink3)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo svg{width:46px;height:34px;flex:none}
.logo-word{font-family:var(--f-brand);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1;color:var(--brand-navy)}
.tagline{display:none;color:var(--ink2);font-size:13px;line-height:1.3;border-left:1px solid var(--rule);padding-left:12px;margin-left:4px}
.tagline b{display:block;color:var(--ink);font-size:14px}
@media (min-width:700px){.tagline{display:block;max-width:300px}}
.deskNav{display:none;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:4px}
.deskNav button{white-space:nowrap;border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.deskNav button[aria-current="page"]{background:var(--navy);color:var(--on-navy)}
@media (min-width:900px){.deskNav{display:flex}}
.profileBtn{white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px;font-weight:600}
.stack{display:flex}
.stack .eb{margin-left:-6px;box-shadow:0 0 0 2px var(--paper)}
.stack .eb:first-child{margin-left:0}

/* ---------- cuenta ---------- */
.topRight{display:flex;align-items:center;gap:8px;flex:none}
.acctBtn{border:0;background:var(--navy);color:var(--on-navy);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.acctBtn .av{width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;font-size:11px;font-weight:700}
.acctBtn.in{background:var(--paper);color:var(--ink);border:1px solid var(--rule);padding:4px 12px 4px 4px}
@media (max-width:480px){.profileBtn .lbl{display:none}}
dialog#authDlg{border:0;border-radius:22px;padding:24px 22px 22px;width:min(400px,calc(100vw - 32px));background:var(--paper);color:var(--ink);box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
dialog#authDlg::backdrop{background:rgba(12,18,32,.55);backdrop-filter:blur(2px)}
.dlgClose{position:absolute;top:10px;right:10px;margin:0}
.dlgClose button{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink2)}
.auth{display:flex;flex-direction:column;gap:14px}
.auth h2{font-size:21px;padding-right:30px}
.auth p{color:var(--ink2);font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:11px;font-weight:600;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--rule)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.field input{border:1px solid var(--rule);background:var(--sunk);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);outline:none}
.field input:focus{border-color:var(--green)}
.auth .err{color:var(--bad);font-size:13px;min-height:1em}
.auth .ok{color:var(--green-text);font-size:13px}
.linkBtn{border:0;background:none;color:var(--green-text);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.auth .row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.danger{background:var(--bad-soft);color:var(--bad)}

/* ---------- bottom nav (mobile) ---------- */
.bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bottomNav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:6px 14px;border-radius:12px;cursor:pointer}
.bottomNav svg{width:22px;height:22px}
.bottomNav button[aria-current="page"]{color:var(--ink)}
.bottomNav button[aria-current="page"] svg{color:var(--green)}
@media (min-width:900px){.bottomNav{display:none}}

/* ---------- banners ---------- */
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);font-size:14px;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;box-shadow:none}
.banner .grow{flex:1;min-width:0}
.btn{border:0;background:var(--navy);color:var(--on-navy);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.green{background:var(--green);color:var(--green-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}

/* ---------- day strip ---------- */
.weekHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekHead .lbl{font-weight:600;font-size:14px;color:var(--ink2)}
.arrows{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:16px;height:16px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--rule);background:var(--paper);border-radius:14px;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-width:0}
.day .dn{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.day .dd{font-size:18px;font-weight:700;line-height:1}
.day .dp{font-size:11px;font-weight:700;color:var(--green-text);background:var(--green-soft);border-radius:999px;padding:1px 6px;line-height:1.5}
.day .dp.none{background:none;color:var(--ink3);font-weight:500}
.day.today::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.day[aria-pressed="true"] .dn{color:var(--on-navy2)}
.day[aria-pressed="true"] .dp{background:var(--green);color:var(--green-ink)}
.day[aria-pressed="true"] .dp.none{background:none;color:var(--on-navy2)}
.day.off{opacity:.45}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.aside{position:sticky;top:20px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.aside{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- hero ---------- */
.hero{background:var(--navy);color:var(--on-navy);border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--green) 45%,transparent),transparent 70%);pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy2)}
.hero .main{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:10px;flex-wrap:wrap;position:relative}
.hero .big{font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--green)}
.hero .big small{font-size:24px;font-weight:700;letter-spacing:0;margin-left:2px}
.hero .where{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero .store{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.hero .with{display:flex;align-items:center;gap:6px;color:var(--on-navy2);font-size:14px}
.hero .save{background:color-mix(in srgb,var(--on-navy) 10%,transparent);border-radius:14px;padding:10px 14px;text-align:right}
.hero .save .k{font-size:12px;color:var(--on-navy2)}
.hero .save .v{font-size:22px;font-weight:700}
.hero .cond{margin-top:14px;font-size:13px;color:var(--on-navy2);position:relative}
.hero.empty .big{font-size:28px;color:var(--on-navy)}

/* ---------- spend ---------- */
.spend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.spend label{font-weight:500}
.money{display:flex;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:4px 6px 4px 14px;gap:4px}
.money span{font-weight:700;color:var(--ink)}
.money input{border:0;background:none;width:110px;font-weight:700;font-size:16px;padding:6px 4px;outline:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- coupons ---------- */
.secHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.secHead .count{font-size:13px;color:var(--ink3);font-weight:500}
.list{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.cp{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:86px minmax(0,1fr);overflow:hidden;border:1px solid var(--rule)}
.cp.dim{opacity:.62}
.cp .stub{background:var(--green-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;position:relative;text-align:center;gap:2px;
  -webkit-mask:radial-gradient(circle at 100% 10px,#0000 6px,#000 6.5px) 0 -10px/100% 20px repeat-y;mask:radial-gradient(circle at 100% 10px,#0000 6px,#000 6.5px) 0 -10px/100% 20px repeat-y}
.cp .stub::after{content:"";position:absolute;right:0;top:8px;bottom:8px;border-right:2px dashed color-mix(in srgb,var(--green-text) 35%,transparent)}
.cp .pct{font-size:28px;font-weight:800;color:var(--green-text);letter-spacing:-.03em;line-height:1}
.cp .pct small{font-size:14px;font-weight:700}
.cp .upto{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--green-text)}
.cp .tp{font-size:10.5px;font-weight:500;color:var(--ink2);margin-top:4px;line-height:1.3}
.cp .tp b{font-size:12px;font-weight:700;color:var(--ink)}
.cp .tp.free{color:var(--green-text)}
.cp.dim .stub{background:var(--sunk)}
.cp.dim .pct,.cp.dim .upto{color:var(--ink2)}
.cp .body{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cp .body:focus-visible{outline:2.5px solid var(--green);outline-offset:-3px}
.cp .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cp .store{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;min-width:0}
.cp .gain{text-align:right;flex:none}
.cp .gain .v{font-weight:700;font-size:15px;color:var(--ink)}
.cp .gain .k{font-size:11px;color:var(--ink3)}
.cp .r2{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);min-width:0}
.cp .r2 span{min-width:0}
.cp .chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green-text)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.cp .more{grid-column:1/-1;padding:0 14px 14px 100px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.cp .more .row{display:flex;gap:8px}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
@media (max-width:520px){.cp{grid-template-columns:74px minmax(0,1fr)}.cp .pct{font-size:24px}.cp .more{padding-left:14px}}

.empty{background:var(--paper);border:1px dashed var(--rule);border-radius:var(--r);padding:20px;text-align:center;color:var(--ink2);font-size:14px}
details.others{background:transparent}
details.others summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:var(--r);border:1px dashed var(--rule);font-weight:600;font-size:14px;color:var(--ink2)}
details.others summary::-webkit-details-marker{display:none}
details.others[open] summary{margin-bottom:10px}

/* ---------- badges ---------- */
.eb,.sb{display:inline-grid;place-items:center;flex:none;color:#fff;font-style:normal;font-weight:700;letter-spacing:-.02em;line-height:1}
.eb{width:20px;height:20px;border-radius:50%;font-size:9px}
.eb.lg{width:30px;height:30px;font-size:11.5px}
.sb{width:26px;height:26px;border-radius:8px;font-size:11px}
.sb.lg{width:34px;height:34px;border-radius:10px;font-size:13px}

/* ---------- side panels ---------- */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:700;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border-radius:12px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t1{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;min-width:0}
.tile .t1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .t2{display:flex;align-items:baseline;gap:6px}
.tile .t2 b{font-size:20px;font-weight:800;color:var(--green-text);letter-spacing:-.02em}
.tile .t2 span{font-size:12px;color:var(--ink2)}
.tile .t3{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.none b{color:var(--ink3)}

/* ---------- mis tarjetas ---------- */
.group{display:flex;flex-direction:column;gap:10px}
.group h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ent{background:var(--paper);border:1.5px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ent.on{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.ent label.main{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.ent label.main .nm{flex:1;min-width:0}
.ent label.main .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.switch{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(16px)}
.cards{display:flex;flex-wrap:wrap;gap:6px}
.tog{position:relative;display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog:has(input:checked){background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tog:has(input:focus-visible){outline:2.5px solid var(--green);outline-offset:2px}

/* ---------- todas ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow)}
table.all{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}
table.all th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);padding:12px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.all td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:middle}
table.all td.n{white-space:nowrap;font-weight:600}
table.all .ent-l{display:inline-flex;align-items:center;gap:6px}
table.all tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--green)}

.foot{font-size:12px;color:var(--ink3);display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid var(--rule)}
@media (prefers-reduced-motion:no-preference){.day,.cp,.btn,.tog,.ent{transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}.day:active,.btn:active{transform:scale(.97)}}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#hoy" aria-label="deelo, inicio">

<script>
(function(){
  const D = JSON.parse(document.getElementById('promo-data').textContent);
  const VIG = D.vigencia || {desde:'2026-11-01', hasta:'2026-11-30'};
  const DIAS = ['','lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
  const DC = ['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const KEY = 'super-descuentos-perfil-v1';
  const fmt = n => '$' + Math.round(n).toLocaleString('es-AR');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };

  // ---------- perfil ----------
  let P = store.get(KEY, null);
  if(!P || !P.ents) P = {ents:{}, jubilado:false, online:false};
  let gasto = store.get(KEY+'-gasto', 80000);
  // Si hay sesión iniciada, deeloCuenta (script de cuentas) guarda el perfil también en la nube.
  const sync = () => { try{ window.deeloCuenta && window.deeloCuenta.guardar({perfil:P, gasto}); }catch(e){} };
  const save = () => { store.set(KEY, P); sync(); };
  const hasProfile = () => Object.keys(P.ents).length > 0 || P.jubilado;

  function match(pr){
    if(pr.req === 'jubilado' && !P.jubilado) return {ok:false, why:'Solo jubilados'};
    if(pr.ent === 'anses') return {ok:!!P.jubilado, why:'Solo jubilados'};
    if(pr.ent === 'credito'){ const ok = Object.entries(P.ents).some(([k,e]) => (e.cards||[]).some(c => c !== 'debito') || ['naranjax','carrefourbanco','cencopay'].includes(k)); if(!ok) return {ok:false, why:'Con tarjeta de crédito'}; if(pr.canal === 'online' && !P.online) return {ok:false, why:'Solo online'}; return {ok:true}; }
    if(pr.bancos){
      const mine = pr.bancos.filter(b => P.ents[b] && (!pr.tjb || D.entidades[b].t !== 'banco' || (P.ents[b].cards||[]).some(c => pr.tjb.includes(c))));
      if(!mine.length) return {ok:false, why: pr.ent === 'visanfc' ? 'Con Visa débito de bancos adheridos' : 'Con un banco adherido a MODO'};
      if(pr.canal === 'online' && !P.online) return {ok:false, why:'Solo online', via:mine};
      return {ok:true, via:mine};
    }
    const e = P.ents[pr.ent];
    if(!e) return {ok:false, why:'Con ' + D.entidades[pr.ent].n};
    if(pr.tj && pr.tj.length && D.entidades[pr.ent].t === 'banco' && !pr.tj.some(t => (e.cards||[]).includes(t)))
      return {ok:false, why:'Con ' + pr.tj.map(t => D.tarjetas[t]).join(' o ')};
    if(pr.canal === 'online' && !P.online) return {ok:false, why:'Solo online'};
    return {ok:true};
  }

  // ---------- fechas ----------
  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const isoDow = d => ((d.getDay()+6)%7)+1;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -(isoDow(x)-1)); };
  const TODAY = new Date(); TODAY.setHours(0,0,0,0);
  let weekStart = mondayOf(TODAY);
  let sel = new Date(TODAY);
  const inVig = d => { const s = iso(d); return s >= VIG.desde && s <= VIG.hasta; };
  const aplicaEn = (pr, d) => inVig(d) && (!pr.vig || (iso(d) >= pr.vig.desde && iso(d) <= pr.vig.hasta)) && (pr.fechas ? pr.fechas.includes(iso(d)) : pr.dias.includes(isoDow(d)));
  const ddmm = f => f.slice(8) + '/' + f.slice(5,7);

  // ---------- cálculo ----------
  function ahorro(pr, monto){
    if(pr.min && monto < pr.min) return {v:0, note:'Mínimo ' + fmt(pr.min)};
    let v = monto * pr.pct / 100, capped = false;
    if(pr.tope && typeof pr.tope === 'object' && v > pr.tope.m){ v = pr.tope.m; capped = true; }
    return {v, capped, unsure: pr.tope === 'app'};
  }
  const optimo = pr => (pr.tope && typeof pr.tope === 'object') ? pr.tope.m / (pr.pct/100) : null;
  const visible = pr => P.online || pr.canal !== 'online';
  function optionsFor(d){
    const out = [];
    D.promos.forEach(pr => { if(aplicaEn(pr, d) && (hasProfile() || visible(pr))) pr.sup.forEach(s => out.push({pr, s, m: match(pr), a: ahorro(pr, gasto)})); });
    const mine = hasProfile() ? out.filter(x => x.m.ok) : out;
    const rest = hasProfile() ? out.filter(x => !x.m.ok && visible(x.pr)) : [];
    const sort = arr => arr.sort((a,b) => (b.a.v - a.a.v) || (b.pr.pct - a.pr.pct));
    return {mine: sort(mine), rest: sort(rest)};
  }

  // ---------- piezas ----------
  const eb = (k, cls='') => { const e = D.entidades[k]; return e && e.m ? `<i class="eb ${cls}" aria-hidden="true" style="background:${e.c}">${esc(e.m)}</i>` : ''; };
  const sbadge = (k, cls='') => { const s = D.supers[k]; return `<i class="sb ${cls}" aria-hidden="true" style="background:${s.c}">${esc(s.m)}</i>`; };
  const entName = pr => D.entidades[pr.ent].n;
  function topeShort(pr){
    if(pr.tope === null) return {t:'Sin tope', free:true};
    if(pr.tope === 'app') return {t:'Tope en app'};
    const per = {compra:'/compra', semana:'/sem', mes:'/mes', dia:'/día'}[pr.tope.p] || '';
    return {t:'Tope ' + fmt(pr.tope.m) + per + (pr.tope.porBanco ? ' c/banco' : ''), stub:`Tope<br><b>${fmt(pr.tope.m)}</b><br>${{compra:'por compra', semana:'por semana', mes:'por mes', dia:'por día'}[pr.tope.p] || ''}${pr.tope.porBanco ? ' c/banco' : ''}`};
  }
  function chips(pr){
    const c = [];
    if(pr.conf === 'oficial') c.push('<span class="chip ok">✓ Oficial</span>');
    else if(pr.conf === 'baja') c.push('<span class="chip bad">Verificar</span>');
    else c.push('<span class="chip warn">Confirmar en app</span>');
    if(pr.canal === 'online') c.push('<span class="chip">Solo online</span>');
    if(pr.canal === 'presencial') c.push('<span class="chip">En sucursal</span>');
    if(pr.fechas) c.push(`<span class="chip">Solo ${pr.fechas.map(ddmm).join(' y ')}</span>`);
    if(pr.req === 'jubilado') c.push('<span class="chip">Jubilados</span>');
    else if(pr.req) c.push(`<span class="chip warn">${esc(pr.req)}</span>`);
    if(pr.min) c.push(`<span class="chip">Mín. ${fmt(pr.min)}</span>`);
    if(pr.viejo) c.push('<span class="chip bad">Sin actualizar</span>');
    return c.join('');
  }
  function viaTxt(m){ return m && m.via ? ' · con ' + m.via.map(b => D.entidades[b].n).join(', ') : ''; }

  let uid = 0;
  function coupon(x, dim){
    const {pr, s, m, a} = x, tp = topeShort(pr), id = 'cp' + (uid++), opt = optimo(pr);
    const fu = (pr.fu||[]).map(f => D.fuentes[f] ? `<a href="${D.fuentes[f].u}" target="_blank" rel="noopener">${esc(D.fuentes[f].n)}</a>` : '').filter(Boolean).join(' · ');
    const pctUse = pr.tope && typeof pr.tope === 'object' ? Math.min(100, (gasto*pr.pct/100) / pr.tope.m * 100) : 0;
    return `<li class="cp${dim ? ' dim' : ''}">
      <div class="stub">${pr.hasta ? '<span class="upto">hasta</span>' : ''}<span class="pct">${pr.pct}<small>%</small></span><span class="tp${tp.free ? ' free' : ''}">${tp.stub || tp.t}</span></div>
      <button class="body" aria-expanded="false" aria-controls="${id}">
        <span class="r1"><span class="store">${sbadge(s)}${esc(D.supers[s].n)}</span>
          <span class="gain">${dim ? `<span class="k">${esc(m.why || '')}</span>` : a.v > 0 ? `<span class="v">${fmt(a.v)}</span><br><span class="k">${a.capped ? 'llegás al tope' : a.unsure ? 'de ahorro aprox.' : 'de ahorro'}</span>` : `<span class="k">${esc(a.note || '')}</span>`}</span></span>
        <span class="r2">${eb(pr.ent)}<span>${esc(entName(pr))}${esc(viaTxt(m))}</span></span>
        <span class="muted" style="font-size:13px">${esc(pr.medio)}</span>
        <span class="chips">${chips(pr)}</span>
      </button>
      <div class="more" id="${id}" hidden>
        ${opt ? `<div class="col" style="gap:4px"><span>Con ${fmt(gasto)} usás el ${Math.round(pctUse)}% del tope. Para aprovecharlo entero, gastá <b>${fmt(opt)}</b>${pr.tope.p==='mes' ? ' en el mes' : pr.tope.p==='semana' ? ' en la semana' : pr.tope.p==='dia' ? ' ese día' : ' en esa compra'}.</span><div class="meter"><i style="width:${pctUse}%"></i></div></div>` : ''}
        ${pr.tope && pr.tope.extra ? `<span>Tope adicional ${esc(pr.tope.extra)}.</span>` : ''}
        ${pr.nota ? `<span>${esc(pr.nota)}</span>` : ''}
        <span class="muted">Vigencia: ${pr.fechas ? 'solo el ' + pr.fechas.map(ddmm).join(' y ') : 'hasta el ' + ddmm((pr.vig || VIG).hasta)}. Fuentes: ${fu}</span>
      </div>
    </li>`;
  }

  // ---------- render: semana ----------
  function renderDays(){
    const end = addDays(weekStart, 6);
    const f = d => d.toLocaleDateString('es-AR', {day:'numeric', month:'short'});
    document.getElementById('weekLbl').textContent = (iso(weekStart) === iso(mondayOf(TODAY)) ? 'Esta semana · ' : '') + f(weekStart) + ' – ' + f(end);
    let h = '';
    for(let i=0;i<7;i++){
      const d = addDays(weekStart, i), o = optionsFor(d).mine, best = o.length ? Math.max(...o.map(x => x.pr.pct)) : 0;
      h += `<button class="day${iso(d)===iso(TODAY) ? ' today' : ''}${inVig(d) ? '' : ' off'}" aria-pressed="${iso(d)===iso(sel)}" data-d="${iso(d)}" aria-label="${DIAS[i+1]} ${d.getDate()}${best ? ', hasta ' + best + '%' : ''}">
        <span class="dn">${DC[i+1]}</span><span class="dd">${d.getDate()}</span><span class="dp${best ? '' : ' none'}">${best ? best + '%' : '—'}</span></button>`;
    }
    document.getElementById('days').innerHTML = h;
  }

  function renderHero(o){
    const el = document.getElementById('hero');
    const dayName = iso(sel) === iso(TODAY) ? 'hoy' : DIAS[isoDow(sel)] + ' ' + sel.getDate();
    if(!inVig(sel)){
      el.className = 'hero empty';
      el.innerHTML = `<div class="eyebrow">${esc(dayName)}</div><div class="main"><div class="big">Sin datos todavía</div></div><p class="cond">Las promos cargadas son de ${esc(D.periodo)}. Cuando se actualicen, aparecen acá.</p>`;
      return;
    }
    const b = o.mine[0];
    if(!b){
      el.className = 'hero empty';
      el.innerHTML = `<div class="eyebrow">Lo mejor de ${esc(dayName)}</div><div class="main"><div class="big">Hoy no hay promos con tus tarjetas</div></div><p class="cond">Mirá los otros días de la semana o las opciones con otras tarjetas más abajo.</p>`;
      return;
    }
    el.className = 'hero';
    const tp = topeShort(b.pr);
    el.innerHTML = `<div class="eyebrow">${hasProfile() ? 'Tu mejor jugada' : 'Lo mejor'} de ${esc(dayName)}</div>
      <div class="main">
        <div class="where">
          <div class="big">${b.pr.pct}<small>%</small></div>
          <div class="store">${sbadge(b.s,'lg')}${esc(D.supers[b.s].n)}</div>
          <div class="with">${eb(b.pr.ent)}${esc(entName(b.pr))} · ${esc(tp.t.toLowerCase())}</div>
        </div>
        <div class="save"><div class="k">Si gastás ${fmt(gasto)}</div><div class="v">Ahorrás ${fmt(b.a.v)}</div></div>
      </div>
      <p class="cond">${esc(b.pr.medio)}${b.pr.min ? ' · mínimo ' + fmt(b.pr.min) : ''}${o.mine.length > 1 ? ` · y ${o.mine.length - 1} opción${o.mine.length > 2 ? 'es' : ''} más abajo` : ''}</p>`;
  }

  function renderList(o){
    const dayName = iso(sel) === iso(TODAY) ? 'hoy' : 'el ' + DIAS[isoDow(sel)];
    document.getElementById('listTitle').textContent = hasProfile() ? `Tus opciones para ${dayName}` : `Todas las promos de ${dayName}`;
    document.getElementById('listCount').textContent = o.mine.length ? o.mine.length + (o.mine.length === 1 ? ' promo' : ' promos') : '';
    const L = document.getElementById('list');
    L.innerHTML = o.mine.length ? o.mine.map(x => coupon(x, false)).join('') : (inVig(sel) ? `<li class="empty">No hay promos ${dayName} para los bancos y tarjetas que elegiste.</li>` : '');
    const O = document.getElementById('others');
    if(hasProfile() && o.rest.length){
      const top = o.rest.slice(0, 12);
      O.innerHTML = `<details class="others"><summary><span>Con otras tarjetas, ${dayName} hay ${o.rest.length} promos más (hasta ${Math.max(...o.rest.map(x=>x.pr.pct))}%)</span><span aria-hidden="true">▾</span></summary><ul class="list">${top.map(x => coupon(x, true)).join('')}</ul></details>`;
    } else O.innerHTML = '';
  }

  function renderTiles(){
    const days = [...Array(7)].map((_,i) => addDays(weekStart, i));
    const html = Object.keys(D.supers).map(s => {
      const cand = new Map();
      days.forEach(d => optionsFor(d).mine.forEach(x => { if(x.s === s){ const c = cand.get(x.pr) || {x, ds:[]}; c.ds.push(d); cand.set(x.pr, c); } }));
      const best = [...cand.values()].sort((a,b) => (b.x.pr.pct - a.x.pr.pct) || (b.ds.length - a.ds.length))[0];
      return `<div class="tile${best ? '' : ' none'}"><div class="t1">${sbadge(s)}<span>${esc(D.supers[s].n)}</span></div>
        ${best ? `<div class="t2"><b>${best.x.pr.pct}%</b><span>${best.ds.map(d => DC[isoDow(d)]).join(', ')}</span></div><div class="t3">${esc(entName(best.x.pr))}</div>` : `<div class="t2"><b>—</b><span>sin promo</span></div><div class="t3">&nbsp;</div>`}</div>`;
    }).join('');
    document.getElementById('tiles').innerHTML = html;
  }

  function renderQuick(){
    const vals = [30000, 80000, 150000, 250000];
    document.getElementById('quick').innerHTML = vals.map(v => `<button data-v="${v}" aria-pressed="${v===gasto}">${v >= 1000 ? (v/1000) + ' mil' : v}</button>`).join('');
    const g = document.getElementById('gasto'); if(document.activeElement !== g) g.value = gasto.toLocaleString('es-AR');
  }

  function renderWeek(){ uid = 0; renderDays(); const o = optionsFor(sel); renderHero(o); renderList(o); renderTiles(); renderQuick(); }

  // ---------- render: tarjetas ----------
  function renderEnts(){
    const groups = [['banco','Bancos'],['billetera','Billeteras'],['tarjeta','Tarjetas de súper'],['programa','Programas y beneficios']];
    const html = groups.map(([t, title]) => {
      const items = Object.entries(D.entidades).filter(([k,e]) => e.t === t);
      if(!items.length) return '';
      return `<section class="group"><h3>${title}</h3><div class="ents">${items.map(([k,e]) => {
        const isJub = k === 'anses', on = isJub ? P.jubilado : !!P.ents[k], cards = (P.ents[k] && P.ents[k].cards) || [];
        return `<div class="ent${on ? ' on' : ''}">
          <label class="main">${eb(k,'lg')}<span class="nm">${isJub ? 'Soy jubilado/a o mayor de 60' : esc(e.n)}${e.hint ? `<small>${esc(e.hint)}</small>` : ''}</span><input type="checkbox" class="switch" id="ent-${k}" ${isJub ? 'data-jub="1"' : `data-ent="${k}"`}${on ? ' checked' : ''}></label>
          ${t === 'banco' && on ? `<div class="cards">${Object.entries(D.tarjetas).map(([c,l]) => `<label class="tog"><input type="checkbox" id="tj-${k}-${c}" data-ent="${k}" data-tj="${c}"${cards.includes(c) ? ' checked' : ''}>${l}</label>`).join('')}</div>` : ''}
        </div>`; }).join('')}
        ${t === 'programa' ? `<div class="ent${P.online ? ' on' : ''}"><label class="main"><span class="nm">También compro online<small>Muestra las promos que valen solo en la web o app del súper</small></span><input type="checkbox" class="switch" id="ent-online" data-online="1"${P.online ? ' checked' : ''}></label></div>` : ''}
      </div></section>`;
    }).join('');
    document.getElementById('entGroups').innerHTML = html;
  }
  document.getElementById('entGroups').addEventListener('change', ev => {
    const t = ev.target;
    if(t.dataset.jub) P.jubilado = t.checked;
    else if(t.dataset.online) P.online = t.checked;
    else if(t.dataset.tj){ const e = P.ents[t.dataset.ent] || (P.ents[t.dataset.ent] = {cards:[]}); e.cards = t.checked ? [...new Set([...(e.cards||[]), t.dataset.tj])] : (e.cards||[]).filter(x => x !== t.dataset.tj); }
    else if(t.dataset.ent){ if(t.checked) P.ents[t.dataset.ent] = {cards: D.entidades[t.dataset.ent].t === 'banco' ? ['debito'] : []}; else delete P.ents[t.dataset.ent]; }
    save(); renderEnts(); renderAll();
    const again = document.getElementById(t.id); if(again) again.focus();
  });
  document.getElementById('clearProfile').addEventListener('click', () => { P = {ents:{}, jubilado:false, online:false}; save(); renderEnts(); renderAll(); });

  // ---------- render: todas ----------
  let supFilter = null;
  function renderAllTable(){
    document.getElementById('superFilters').innerHTML = [`<label class="tog"><input type="radio" name="sf" id="sf-all" value=""${!supFilter ? ' checked' : ''}>Todos</label>`]
      .concat(Object.entries(D.supers).map(([k,s]) => `<label class="tog"><input type="radio" name="sf" id="sf-${k}" value="${k}"${supFilter===k ? ' checked' : ''}>${esc(s.n)}</label>`)).join('');
    const list = D.promos.filter(pr => !supFilter || pr.sup.includes(supFilter)).map(pr => ({pr, m: match(pr)})).sort((a,b) => (b.m.ok - a.m.ok) || (b.pr.pct - a.pr.pct));
    document.getElementById('allCount').textContent = list.length + ' promos' + (hasProfile() ? ' · ' + list.filter(x => x.m.ok).length + ' para vos' : '');
    document.getElementById('allTable').innerHTML = `<thead><tr><th>Súper</th><th>%</th><th>Días</th><th>Banco / billetera</th><th>Cómo pagar</th><th>Tope</th><th>Estado</th><th>¿Para vos?</th></tr></thead><tbody>` +
      list.map(({pr, m}) => `<tr class="${m.ok && hasProfile() ? 'mine' : ''}">
        <td>${pr.sup.map(s => `<span class="ent-l">${sbadge(s)} ${esc(D.supers[s].n)}</span>`).join('<br>')}</td>
        <td class="n">${pr.hasta ? 'hasta ' : ''}${pr.pct}%</td>
        <td class="n">${pr.fechas ? pr.fechas.map(ddmm).join(' ') : pr.dias.length ? pr.dias.map(d => DC[d]).join(' ') : '—'}</td>
        <td><span class="ent-l">${eb(pr.ent)} ${esc(entName(pr))}</span></td>
        <td>${esc(pr.medio)}${pr.canal==='online' ? ' <span class="chip">Solo online</span>' : ''}</td>
        <td class="n">${topeShort(pr).t}</td>
        <td>${pr.conf === 'oficial' ? '<span class="chip ok">✓ Oficial</span>' : pr.conf === 'baja' ? '<span class="chip bad">Verificar</span>' : '<span class="chip warn">Confirmar</span>'}</td>
        <td>${!hasProfile() ? '<span class="muted">—</span>' : m.ok ? '<b style="color:var(--green-text)">Sí</b>' : `<span class="muted">${esc(m.why || 'No')}</span>`}</td>
      </tr>`).join('') + '</tbody>';
  }
  document.getElementById('superFilters').addEventListener('change', ev => { supFilter = ev.target.value || null; renderAllTable(); });

  // ---------- banners, perfil, footer ----------
  function renderChrome(){
    const ents = Object.keys(P.ents);
    document.getElementById('profileBtn').innerHTML = ents.length
      ? `<span class="stack">${ents.slice(0,4).map(k => eb(k)).join('')}</span><span class="lbl">${ents.length} ${ents.length === 1 ? 'medio' : 'medios'}</span>`
      : `<span class="eb" style="background:var(--green);color:var(--green-ink)">+</span><span class="lbl">Mis tarjetas</span>`;
    const b = [];
    const caidas = Object.entries(D.estado || {}).filter(([,v]) => v !== 'ok').map(([k]) => ({cencosud:'Jumbo/Disco/Vea', carrefour:'Carrefour', dia:'Día', 'coto-vigentes':'Coto', coto:'Coto (legales)'}[k] || k));
    if(caidas.length) b.push(`<div class="banner warn"><span class="grow">No pudimos actualizar ${esc([...new Set(caidas)].join(', '))} en la última corrida: mostramos sus promos anteriores.</span></div>`);
    if(iso(TODAY) > VIG.hasta) b.push(`<div class="banner warn"><span class="grow">Las promos cargadas son de <b>${esc(D.periodo)}</b> y ya vencieron. Se actualizan al empezar el mes.</span></div>`);
    if(!hasProfile()) b.push(`<div class="banner"><span class="grow"><b>Elegí con qué pagás</b> y te mostramos solo tus descuentos, con lo que ahorrás en pesos.</span><button class="btn green" data-go="tarjetas">Elegir</button></div>`);
    document.getElementById('banners').innerHTML = b.join('');
    document.getElementById('foot').innerHTML = `<span>Actualizado el ${D.actualizado.split('-').reverse().join('/')} desde los sitios oficiales de cada súper (se actualiza solo todos los lunes). Algunas promos salen de notas de prensa.</span>
      <span><b>✓ Oficial</b>: figura en el sitio del súper. <b>Confirmar en app</b>: solo notas de prensa. <b>Verificar</b>: una sola fuente o dato viejo. El ahorro es una estimación para una compra; los topes mensuales o semanales se comparten entre compras.</span>
      <span>deelo no está afiliado a ningún supermercado, banco ni billetera. Las marcas pertenecen a sus dueños. <a href="/acerca.html">Cómo funciona, aviso legal y privacidad</a>.</span>`;
  }

  // ---------- navegación ----------
  const VIEWS = ['hoy','tarjetas','todas'];
  function show(v){
    if(!VIEWS.includes(v)) v = 'hoy';
    VIEWS.forEach(x => document.getElementById('view-'+x).hidden = x !== v);
    document.querySelectorAll('.deskNav button, .bottomNav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === v ? 'page' : 'false'));
    if(location.hash.slice(1) !== v){ try{ history.replaceState(null, '', '#' + v); }catch(e){} }
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', ev => {
    const go = ev.target.closest('[data-go]'); if(go){ ev.preventDefault(); show(go.dataset.go); return; }
    const day = ev.target.closest('.day'); if(day){ const [y,m,d] = day.dataset.d.split('-').map(Number); sel = new Date(y, m-1, d); renderWeek(); return; }
    const q = ev.target.closest('#quick button'); if(q){ gasto = Number(q.dataset.v); store.set(KEY+'-gasto', gasto); sync(); renderWeek(); return; }
    const body = ev.target.closest('.cp .body'); if(body && !ev.target.closest('a')){ const more = document.getElementById(body.getAttribute('aria-controls')); const open = body.getAttribute('aria-expanded') === 'true'; body.setAttribute('aria-expanded', String(!open)); more.hidden = open; }
  });
  document.getElementById('prevWeek').addEventListener('click', () => { weekStart = addDays(weekStart, -7); sel = addDays(sel, -7); renderWeek(); });
  document.getElementById('nextWeek').addEventListener('click', () => { weekStart = addDays(weekStart, 7); sel = addDays(sel, 7); renderWeek(); });
  document.getElementById('gasto').addEventListener('input', ev => {
    const v = Number(ev.target.value.replace(/\D/g, '')) || 0; gasto = v; store.set(KEY+'-gasto', gasto); sync();
    const o = optionsFor(sel); uid = 0; renderHero(o); renderList(o); renderQuick();
  });
  document.getElementById('gasto').addEventListener('blur', ev => { ev.target.value = gasto.toLocaleString('es-AR'); });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));

  function renderAll(){ renderChrome(); renderWeek(); renderAllTable(); }
  renderEnts(); renderAll();
  window.deelo = {
    estado: () => ({perfil:P, gasto}),
    aplicar(d){
      if(d && d.perfil && d.perfil.ents){ P = {ents:d.perfil.ents, jubilado:!!d.perfil.jubilado, online:!!d.perfil.online}; store.set(KEY, P); }
      if(d && typeof d.gasto === 'number' && d.gasto > 0){ gasto = d.gasto; store.set(KEY+'-gasto', gasto); }
      renderEnts(); renderAll();
    }
  };
  show(location.hash.slice(1) || 'hoy');
})();
</script>
