# Control de precios: todos los días compara una muestra de precios de deelo con la web de cada súper. Si cambió más del 25% de la muestra se marca en rojo (GitHub avisa por mail).
# También se puede correr a mano desde Actions -> "deelo: control de precios" -> Run workflow.
name: "deelo: control de precios"

on:
  schedule:
    - cron: "23 15 * * *"   # todos los días 15:23 UTC = 12:23 en Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Comparar precios de deelo con la web de cada súper
        run: node scraper/control.js 40
