# Actualiza las promos de deelo (deelo.ar) todos los lunes a las 8:00 de Argentina.
# También se puede correr a mano desde la pestaña Actions -> "deelo: actualizar promos" -> Run workflow.
name: "deelo: actualizar promos"

on:
  schedule:
    - cron: "7 11 * * 1"   # lunes 11:07 UTC = 8:07 en Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deelo-promos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright (solo Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Leer las promos oficiales de cada súper
        run: node scraper/scrape.js data/oficial.json

      - name: Armar los datos de la página
        run: node scraper/build.js

      - name: Guardar si hubo cambios
        run: |
          git config user.name "deelo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data src/app.html index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en las promos."
          else
            git commit -m "deelo: promos actualizadas $(date -u +%Y-%m-%d)"
            git push
          fi
