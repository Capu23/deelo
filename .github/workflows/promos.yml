# Actualiza las promos de deelo (deelo.ar) todos los lunes a las 8:00 de Argentina.
# También se puede correr a mano desde la pestaña Actions -> "deelo: actualizar promos" -> Run workflow.
name: "deelo: actualizar promos"

on:
  schedule:
    - cron: "7 11 * * 1"   # lunes 11:07 UTC = 8:07 en Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deelo-promos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright (solo Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Leer las promos oficiales de cada súper
        run: node scraper/scrape.js data/oficial.json

      - name: Armar los datos de la página
        run: node scraper/build.js

      - name: Traer precios de la canasta (Jumbo, Disco, Vea, Carrefour, Día y Coto)
        id: precios
        continue-on-error: true   # si falla, la página sigue con los precios de la semana anterior
        run: |
          # Recorre el catálogo completo de cada súper (unos 25 min), renueva la lista de productos
          # (en 3 o más cadenas, sin marcas propias) y saca los precios de ese recorrido.
          node scraper/catalogo.js && node scraper/canasta.js 3 || echo "catálogo falló: se mantiene la canasta anterior"
          node scraper/precios.js | tee precios.log
          # Promos del súper de Jumbo, Disco y Vea (3x2, 2do al 50%…) con sus fechas
          node scraper/cencosud-promos.js | tee -a precios.log && node scraper/actualizar-promos.js | tee -a precios.log || echo "promos de Cencosud fallaron: siguen las anteriores"
          # Resumen visible en la pestaña Actions
          { echo "### deelo · precios del $(date -u +%Y-%m-%d)"; echo '```'; tail -n 8 precios.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar si hubo cambios
        run: |
          git config user.name "deelo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Si mientras corría se publicó otro cambio en main, se toma la última versión, se copian los
          # datos nuevos encima y se vuelve a armar la página (hasta 3 intentos).
          cp -r data "$RUNNER_TEMP/data-nueva"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r "$RUNNER_TEMP/data-nueva/." data/
            node scraper/build.js > /dev/null
            git add data src/app.html index.html
            if git diff --cached --quiet; then echo "Sin cambios en las promos."; exit 0; fi
            git commit -q -m "deelo: promos actualizadas $(date -u +%Y-%m-%d)"
            if git push -q; then echo "Publicado."; exit 0; fi
            echo "El push falló (intento $i): reintento."; sleep 10
          done
          exit 1

      # Si los precios fallaron, la página queda con los de la semana anterior: el workflow se marca
      # en rojo para que GitHub avise por mail.
      - name: Avisar si fallaron los precios
        if: steps.precios.outcome == 'failure'
        run: |
          echo "::error::Fallaron los precios: la página sigue con los de la semana anterior."
          exit 1
